<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mpesaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A34F"/>
      <stop offset="100%" stop-color="#00803D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Rounded card background -->
  <rect width="160" height="160" rx="24" fill="url(#mpesaBg)"/>
  
  <!-- Red brand accent stripe -->
  <path d="M 0 120 Q 80 108 160 120 L 160 136 Q 80 124 0 136 Z" fill="#E21B23"/>
  <rect x="0" y="132" width="160" height="28" rx="0" fill="#E21B23"/>
  <rect x="0" y="136" width="160" height="24" rx="20" fill="#E21B23"/>

  <!-- Phone / Connection Signal Icon -->
  <circle cx="80" cy="52" r="14" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="80" cy="52" r="9" fill="#FFFFFF"/>
  <path d="M 64 36 A 26 26 0 0 1 96 36" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 54 26 A 38 38 0 0 1 106 26" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>

  <!-- M-PESA Text -->
  <g filter="url(#shadow)">
    <text x="80" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">M-PESA</text>
  </g>
  <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#E8F8EE" text-anchor="middle" letter-spacing="2">SAFARICOM</text>
  <text x="80" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ETHIOPIA</text>
</svg>

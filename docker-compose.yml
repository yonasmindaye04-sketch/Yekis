services:
  postgres:
    build:
      context: ./infra/postgres # custom image installs the pgaudit extension — see infra/postgres/Dockerfile
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pgaudit"]
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_dev_only
      POSTGRES_DB: marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marketplace
      MINIO_ROOT_PASSWORD: marketplace_dev_only
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

  # Full-text search backend. Optional: enable with
  #   docker compose --profile search up -d
  # and set OPENSEARCH_URL=http://localhost:9200 in apps/backend/.env.
  # Without it, gig/job search falls back to the existing Postgres queries.
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data

volumes:
  pgdata:
  miniodata:
  opensearchdata:

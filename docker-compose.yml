services:
  postgres:
    build:
      context: ./infra/postgres # custom image installs the pgaudit extension — see infra/postgres/Dockerfile
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pgaudit"]
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_dev_only
      POSTGRES_DB: marketplace
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A password is required: an unauthenticated Redis on a published port lets
    # anyone read session data and flush the rate-limit keys. The password is
    # injected from the environment (see .env / REDIS_PASSWORD) so no credential
    # is committed here. REDISCLI_AUTH is set so `docker exec ... redis-cli`
    # health checks still authenticate.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in your .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Credentials come from the environment. Defaults such as minioadmin are
    # public knowledge and would be worse than a committed dev password.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your .env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - miniodata:/data

  # Full-text search backend. Optional: enable with
  #   docker compose --profile search up -d
  # and set OPENSEARCH_URL=http://localhost:9200 in apps/backend/.env.
  # Without it, gig/job search falls back to the existing Postgres queries.
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:

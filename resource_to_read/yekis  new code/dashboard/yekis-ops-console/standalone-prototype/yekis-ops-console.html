<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yekis — Operations Console</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --border:#e4e8f0; --border-soft:#eef1f6;
  --text:#111a2e; --text-2:#5b6779; --text-3:#93a0b4;
  --primary:#4f46e5; --primary-soft:#eef0ff; --primary-dark:#4338ca;
  --green:#059669; --amber:#d97706; --red:#dc2626;
  --blue:#2563eb; --violet:#7c3aed; --sky:#0284c7;
  --sidebar-w:252px; --header-h:60px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.header{height:var(--header-h);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:50}
.content{padding:28px;max-width:1440px;width:100%}

.brand{display:flex;align-items:center;gap:10px;padding:0 20px;height:var(--header-h);border-bottom:1px solid var(--border);flex-shrink:0}
.brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#4338ca);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(79,70,229,.35)}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-tag{font-size:9px;font-weight:800;color:var(--primary);letter-spacing:.1em;margin-left:6px}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav::-webkit-scrollbar{width:4px}.nav::-webkit-scrollbar-thumb{background:#d4dae4;border-radius:4px}
.nav-group{margin-bottom:18px}
.nav-label{font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:transparent;border-radius:9px;color:var(--text-2);font-size:13px;font-weight:500;text-align:left;transition:all .15s}
.nav-item svg{flex-shrink:0;opacity:.75}
.nav-item:hover{background:#f2f4f8;color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--amber)}
.sidebar-foot{border-top:1px solid var(--border);padding:12px}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:background .15s;cursor:pointer}
.user-chip:hover{background:#f2f4f8}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.user-chip .nm{font-size:13px;font-weight:700;line-height:1.2}
.user-chip .em{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.menu-btn{display:none;border:1px solid var(--border);background:#fff;border-radius:9px;width:36px;height:36px;align-items:center;justify-content:center;color:var(--text-2)}
.search-wrap{position:relative;flex:1;max-width:440px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:10px;background:#f7f8fb;outline:none;transition:all .15s}
.search-wrap input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{color:var(--primary);border-color:#c9cdf5}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid #fff}
.crumb{font-size:12px;color:var(--text-3);font-weight:500}
.crumb b{color:var(--text);font-weight:700}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.page-sub{font-size:13px;color:var(--text-2);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text-2)}
.btn-ghost:hover{border-color:#c9cdf5;color:var(--primary)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(.93)}
.btn-red{background:#fff;border-color:#f4c7c7;color:var(--red)}.btn-red:hover{background:#fff5f5}
.btn-amber{background:var(--amber);color:#fff}.btn-amber:hover{filter:brightness(.93)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}

.stat{padding:18px 20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.08)}
.stat-ic{margin-bottom:12px;display:flex;align-items:center}
.stat-v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat-l{font-size:12px;color:var(--text-2);margin-top:2px;font-weight:600}
.stat-t{position:absolute;top:20px;right:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:3px}
.t-up{color:var(--green)}.t-dn{color:var(--red)}

/* text-first status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.02em;white-space:nowrap;background:none;padding:0;border:none}
.pill .pdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.p-green{color:#15803d}.p-amber{color:#b45309}.p-red{color:#dc2626}.p-blue{color:#2563eb}
.p-sky{color:#0284c7}.p-violet{color:#7c3aed}.p-gray{color:#6b7280}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;margin-bottom:16px}
.f-search{position:relative;flex:1;min-width:200px}
.f-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.f-search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:9px;background:#f7f8fb;outline:none}
.f-search input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
select.sel{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:#f7f8fb;outline:none;font-weight:600;color:var(--text-2);cursor:pointer}
select.sel:focus{border-color:var(--primary);background:#fff}
textarea.inp-t{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;outline:none;resize:vertical;min-height:74px}
textarea.inp-t:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfd;white-space:nowrap}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#f8f9fc}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:none}
.cell-main{font-weight:600;font-size:13px}
.cell-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.amount{font-weight:800;font-size:13px}
.rail{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-2)}
.rail i{width:7px;height:7px;border-radius:50%;display:inline-block}
.rail-tele i{background:#22c55e}.rail-cbe i{background:#3b82f6}

.pager{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-2)}
.pager-btns{display:flex;gap:8px;align-items:center}

.banner{display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:16px;font-size:13.5px;font-weight:600;background:none;border:none}
.banner b{font-weight:800;color:var(--ac)}
.banner .banner-ic{display:flex;align-items:center;color:var(--ac);flex-shrink:0}
.b-amber{--ac:#b45309}.b-green{--ac:#047857}.b-red{--ac:#dc2626}.b-blue{--ac:#1d4ed8}

.sec-title{font-size:15px;font-weight:800;margin-bottom:12px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-pad{padding:20px}
.empty{padding:48px 20px;text-align:center;color:var(--text-3);font-size:13px;font-weight:600}

.act-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;transition:background .12s;cursor:pointer}
.act-row:hover{background:#f7f8fb}
.act-ic{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-t{font-size:13px;font-weight:700}
.act-s{font-size:11.5px;color:var(--text-3);margin-top:1px}

.qa-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px;border:1px solid var(--border-soft);background:#fbfcfe;border-radius:10px;transition:all .15s;font-size:13px;font-weight:700;color:var(--text)}
.qa-btn:hover{border-color:#c9cdf5;background:#fff;box-shadow:var(--shadow)}
.qa-l{display:flex;align-items:center;gap:10px}
.qa-ic{display:flex;align-items:center}
.qa-n{font-size:13px;font-weight:800}

.expand-row td{background:#f6f7fd!important;padding:18px 16px;border-bottom:1px solid var(--border)!important}
.settle-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.settle-grid .fld{flex:1;min-width:190px}
.lbl{display:block;font-size:11px;font-weight:800;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}

.acct-card{padding:16px;transition:transform .15s,box-shadow .15s}
.acct-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.07)}
.acct-type{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
.acct-name{font-size:12.5px;color:var(--text-2);margin-top:4px;font-weight:600}
.acct-bal{font-size:18px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.acct-code{font-size:11px;color:var(--text-3);margin-top:3px}

.kv{background:#f8f9fc;border:1px solid var(--border-soft);border-radius:10px;padding:14px}
.kv-k{font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}
.kv-v{font-size:16px;font-weight:800;margin-top:5px}

.matrix th,.matrix td{padding:9px 10px;border-bottom:1px solid var(--border-soft);font-size:12px}
.matrix .yes{color:var(--green);font-weight:800}
.matrix .no{color:#cdd4df}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-2);background:none;border:none;margin-bottom:16px;padding:6px 0;transition:color .15s}
.back-link:hover{color:var(--primary)}

/* health cards — no line indicators, text-first only */
.health-card{padding:18px}
.h-name{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.h-state{font-size:16px;font-weight:800;margin-top:6px;display:flex;align-items:center;gap:7px}
.h-ok .h-state{color:var(--green)}.h-bad .h-state{color:var(--red)}
.h-detail{font-size:11.5px;color:var(--text-2);margin-top:5px;font-weight:500}

/* ── Charts (hand-rolled SVG, no libs) ─────────────────────────────── */
.chart{width:100%;height:auto;display:block}
.ax{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;fill:#93a0b4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn 1.2s .1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
.fadeA{opacity:0;animation:fadeIn .9s .45s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.pt{fill:#fff;stroke-width:2;cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .12s}
.pt:hover{transform:scale(1.7)}
.bar{transform-box:fill-box;transform-origin:bottom;animation:growY .7s cubic-bezier(.16,1,.3,1) both;cursor:pointer}
.bar:hover{filter:brightness(1.12)}
@keyframes growY{from{transform:scaleY(0)}}
.donut{width:150px;height:150px;flex-shrink:0;animation:rotIn .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rotIn{from{transform:rotate(-50deg);opacity:0}}
.dseg{cursor:pointer;transition:stroke-width .15s}
.dseg:hover{stroke-width:20}
.d-num{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;fill:#111a2e}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.lg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg-l{color:var(--text-2);font-weight:600;flex:1}
.lg-p{color:var(--text-3);font-size:11.5px;width:36px;text-align:right}
.spark{width:100%;height:32px;display:block;margin-top:10px}
.hb-row{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;font-size:12.5px;align-items:baseline}
.hb-l{font-weight:700}
.hb-v{font-weight:800}
.hb-m{color:var(--text-3);font-weight:600;font-size:11.5px}
.hb-track{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;margin-top:6px}
.hb-fill{height:100%;border-radius:6px;animation:growW .9s cubic-bezier(.16,1,.3,1) both}
@keyframes growW{from{width:0}}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.cl-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-2)}
#chart-tip{position:fixed;left:0;top:0;z-index:400;background:#111a2e;color:#fff;font-size:12px;font-weight:700;padding:7px 11px;border-radius:8px;pointer-events:none;opacity:0;transform:translate(-50%,-135%);transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.gc-2-1{grid-template-columns:2fr 1fr}
.gc-1-1{grid-template-columns:1fr 1fr}

/* ── Action Center — prioritised directives ────────────────────────── */
.ac-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ac-count{font-size:12px;font-weight:800}
.ac-prog{height:6px;background:#eef1f6;border-radius:6px;margin:12px 0 5px;overflow:hidden}
.ac-prog-f{height:100%;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:6px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.ac-prog-l{font-size:11px;color:var(--text-3);font-weight:700;margin-bottom:14px}
.ac-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border-soft);border-radius:10px;margin-bottom:8px;transition:all .15s;background:#fff}
.ac-item:hover{border-color:#c9cdf5;box-shadow:var(--shadow)}
.ac-item.done{opacity:.5}
.ac-item.done .ac-t{text-decoration:line-through}
.ac-sev{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.ac-body{flex:1;min-width:0}
.ac-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;margin-left:8px;vertical-align:1px}
.ac-t{font-size:13px;font-weight:800}
.ac-w{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}
.ac-acts{display:flex;gap:6px;flex-shrink:0;align-items:center}

/* ── Command palette (Ctrl+K) ──────────────────────────────────────── */
.pal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:180;display:flex;align-items:flex-start;justify-content:center;padding:11vh 20px 20px;animation:fadeUp .18s ease}
.pal{background:#fff;border-radius:14px;width:min(640px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft)}
.pal-in input{flex:1;border:none;outline:none;font-size:15px;font-weight:600;background:none;color:var(--text)}
.pal-list{max-height:340px;overflow-y:auto;padding:8px}
.pal-list::-webkit-scrollbar{width:4px}.pal-list::-webkit-scrollbar-thumb{background:#d4dae4;border-radius:4px}
.pal-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:none;background:none;border-radius:9px;text-align:left;font-size:13.5px;font-weight:600;color:var(--text-2)}
.pal-item.sel{background:var(--primary-soft);color:var(--primary)}
.pal-item .pi-sub{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700;flex-shrink:0}
.pal-foot{padding:9px 16px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-3);display:flex;gap:14px;font-weight:600}
.srch-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}

/* ── Review queues (list + detail) ── */
.queue-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;min-height:580px}
.queue-list{overflow-y:auto;max-height:calc(100vh - 250px);padding-right:2px}
.queue-list::-webkit-scrollbar{width:4px}.queue-list::-webkit-scrollbar-thumb{background:#d4dae4;border-radius:4px}
.q-card{width:100%;text-align:left;padding:13px 14px;border:1px solid var(--border);background:#fff;border-radius:11px;margin-bottom:8px;transition:all .15s}
.q-card:hover{border-color:#c9cdf5;box-shadow:var(--shadow)}
.q-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.q-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q-head strong{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-date{font-size:11px;color:var(--text-3);flex-shrink:0}
.q-sub{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
.q-sub .subject{font-size:12px;color:var(--text-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-detail{min-height:580px;display:flex;flex-direction:column}
.qd-body{padding:20px;flex:1;overflow-y:auto;max-height:calc(100vh - 330px)}
.qd-body::-webkit-scrollbar{width:5px}.qd-body::-webkit-scrollbar-thumb{background:#d4dae4;border-radius:5px}
.qd-head{padding:18px 20px;border-bottom:1px solid var(--border-soft)}
.qd-head h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.qd-meta{font-size:12px;color:var(--text-2);margin-top:4px}
.qd-actions{padding:16px 20px;border-top:1px solid var(--border-soft);background:#fafbfd;border-radius:0 0 var(--radius) var(--radius)}
.empty-detail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:10px;padding:40px;text-align:center}
.empty-detail p{font-weight:600;color:var(--text-2)}
.kbd-hint{font-size:11.5px;color:var(--text-3);font-weight:500}
.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:800;color:var(--text-2);background:#f7f8fb;font-family:'JetBrains Mono',monospace;line-height:1.7}

.checks{display:flex;gap:14px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.check.pass{color:var(--green)}.check.fail{color:var(--red)}.check.none{color:var(--text-3)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist-item{padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.hist-item:last-child{border-bottom:none}
.hist-reason{font-size:12px;color:var(--text-2);margin-top:2px}

.sla{font-size:12px;font-weight:800;white-space:nowrap}
.sla.ok{color:var(--green)}.sla.warn{color:var(--amber)}.sla.breach{color:var(--red)}

.scope-box{background:#f8f9fc;border:1px solid var(--border-soft);border-radius:10px;padding:14px;font-size:13px;color:var(--text-2);line-height:1.55}

.ev-b-head{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;color:var(--text-3);font-weight:700}
.ev-bubble.client .ev-b-head strong{color:var(--blue)}
.ev-bubble.freelancer .ev-b-head strong{color:var(--violet)}
.ev-bubble p{font-size:13px;line-height:1.5}

.outcome-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.outcome-btn{flex:1;min-width:140px;padding:11px;border:1px solid var(--border);background:#fff;border-radius:9px;font-weight:800;font-size:13px;color:var(--text-2);transition:all .15s}
.outcome-btn:hover{border-color:#c9cdf5}
.outcome-btn.active{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}

.calc{border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;background:#fafbfd;margin:12px 0}
.calc h5{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}

.calc-row.sub{color:var(--text-2);font-weight:600}
.calc-row.sub span:last-child{color:var(--red);font-weight:700}
.calc-row.total{border-top:1px dashed var(--border);margin-top:7px;padding-top:9px;font-weight:800}

input[type=range]{width:100%;accent-color:var(--primary);cursor:pointer}
.split-lbl{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px;display:flex;justify-content:space-between}

.doc-tiles{display:flex;gap:8px;flex-wrap:wrap}
.doc-tile{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text-2);transition:all .15s}
.doc-tile:hover{border-color:var(--primary);color:var(--primary);box-shadow:var(--shadow)}

.viewer-overlay{position:fixed;inset:0;background:rgba(8,12,24,.94);z-index:200;display:flex;flex-direction:column;animation:fadeUp .2s ease}
.viewer-header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;color:#fff;gap:12px;flex-wrap:wrap}

.viewer-count{font-size:12px;color:#8b96ad;font-weight:600;margin-top:1px}

.viewer-controls button{background:rgba(255,255,255,.08);border:none;color:#fff;width:38px;height:38px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.viewer-controls button:hover{background:rgba(255,255,255,.18)}
.viewer-controls .v-div{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 6px}
.viewer-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab}
.viewer-stage.dragging{cursor:grabbing}
.viewer-doc{transform-origin:center;user-select:none;transition:transform .18s ease}
.viewer-stage.dragging .viewer-doc{transition:none}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:none;color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5;transition:background .15s}
.nav-arrow:hover{background:rgba(255,255,255,.22)}

.nav-arrow.prev{left:18px}.nav-arrow.next{right:18px}

.thumb-btn{background:rgba(255,255,255,.07);color:#cfd6e4;border:1px solid transparent;padding:7px 15px;border-radius:8px;font-size:12px;font-weight:700;transition:all .15s}
.thumb-btn:hover{background:rgba(255,255,255,.14)}
.thumb-btn.active{border-color:#fff;color:#fff;background:rgba(255,255,255,.16)}

.toast{position:fixed;bottom:24px;right:24px;background:#111a2e;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fadeUp .25s ease;display:flex;gap:9px;align-items:center;max-width:360px}

/* keyboard delegation — palette-aware */
let keyHandler=null;
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen?closePalette():openPalette(); return; }
  if(palOpen){
    const items=window._palCur||[];
    if(e.key==='Escape'){ e.preventDefault(); closePalette(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(items.length-1,palSel+1); renderPalette(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(0,palSel-1); renderPalette(); return; }
    if(e.key==='Enter'){ e.preventDefault(); if(items[palSel]) palRun(palSel); return; }
    return;
  }
  if(keyHandler) keyHandler(e);
});
function setKeys(fn){ keyHandler=fn; }

/* ═══════════ CHART ENGINE (hand-rolled SVG, no libs) ═══════════ */
function spark(data,color){
  const w=110,h=30,min=Math.min(...data),max=Math.max(...data);
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-4-((v-min)/(max-min||1))*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="1" class="draw"/></svg>`;
}
function areaChart(labels,data,color){
  const W=640,H=250,L=46,R=12,T=14,B=30;
  const max=Math.max(...data)*1.15;
  const X=i=>L+i*(W-L-R)/(data.length-1);
  const Y=v=>T+(1-v/max)*(H-T-B);
  const line=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L${X(data.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B} Z`;
  let grid='';
  for(let t=0;t<=4;t++){const v=max*t/4,y=Y(v);
    grid+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="#eef1f6"/><text x="${L-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${v.toFixed(0)}M</text>`;}
  const step=Math.ceil(labels.length/7);
  const xl=labels.map((l,i)=>(i%step===0||i===labels.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="ax">${l}</text>`:'').join('');
  const dots=data.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" class="pt" stroke="${color}" data-tip="${labels[i]} · ETB ${v.toFixed(1)}M"/>`).join('');
  const gid='g'+color.slice(1);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    <path d="${area}" fill="url(#${gid})" class="fadeA"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" pathLength="1" class="draw"/>
    ${dots}</svg>`;
}
function barChart(labels,series){
  const W=640,H=250,L=46,R=12,T=14,B=30;
  const max=Math.max(...series.flatMap(s=>s.values))*1.15;
  const gw=(W-L-R)/labels.length, bw=Math.min(26,(gw-18)/series.length);
  let out='';
  for(let t=0;t<=4;t++){const v=max*t/4,y=T+(1-t/4)*(H-T-B);
    out+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="#eef1f6"/><text x="${L-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${v.toFixed(0)}M</text>`;}
  labels.forEach((lb,i)=>{
    const cx=L+gw*i+gw/2;
    out+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" class="ax">${lb}</text>`;
    series.forEach((s,si)=>{
      const v=s.values[i], bh=(v/max)*(H-T-B);
      const x=cx-(series.length*bw+6*(series.length-1))/2+si*(bw+6);
      out+=`<rect x="${x.toFixed(1)}" y="${(H-B-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${s.color}" class="bar" style="animation-delay:${(i*series.length+si)*45}ms" data-tip="${lb} · ${s.name}: ETB ${v}M"/>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${out}</svg>`;
}
function donut(segs,centerSub){
  const total=segs.reduce((s,x)=>s+x.value,0)||1;
  const R=54,C=2*Math.PI*R; let off=0;
  const arcs=segs.map((s,i)=>{const len=s.value/total*C;
    const a=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="16"
      stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 70 70)" class="dseg" data-tip="${s.label}: ${fmt(s.value)} · ${Math.round(s.value/total*100)}%"/>`;
    off+=len; return a;}).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" class="donut">${arcs}
    <text x="70" y="66" text-anchor="middle" class="d-num">${fmtE(total)}</text>
    <text x="70" y="82" text-anchor="middle" class="ax">${centerSub}</text></svg>
    <div class="legend">${segs.map(s=>`<div class="lg-row"><span class="lg-dot" style="background:${s.color}"></span><span class="lg-l">${s.label}</span><b>${fmtE(s.value)}</b><span class="lg-p">${Math.round(s.value/total*100)}%</span></div>`).join('')}</div></div>`;
}
function hbars(rows){
  const max=Math.max(...rows.map(r=>r.value))||1;
  return `<div class="hbars">${rows.map((r,i)=>`<div class="hb-row">
    <div class="hb-top"><span class="hb-l">${r.label}</span><b class="hb-v">${r.value}${r.meta?` <span class="hb-m">${r.meta}</span>`:''}</b></div>
    <div class="hb-track"><div class="hb-fill" style="width:${(r.value/max*100).toFixed(1)}%;background:${r.color};animation-delay:${i*70}ms"></div></div></div>`).join('')}</div>`;
}

/* ═══════════ ACTION CENTER — computed, prioritised directives ═══════════ */
function actionItems(){
  const A=[];
  disputeItems.forEach(d=>{
    if(d.slaH<0) A.push({sev:3,tag:'SLA BREACH',t:`Mediate “${d.job}”`,why:`Deadline passed ${Math.abs(d.slaH)}h ago — ${fmt(d.amt)} of escrow stays locked until this is resolved.`,page:'dispute-queue',pre:()=>{state.dqSel=d.id;}});
    else if(d.slaH<24) A.push({sev:2,tag:'DUE TODAY',t:`Resolve “${d.job}”`,why:`Mediation SLA due in ${d.slaH}h — schedule the decision now.`,page:'dispute-queue',pre:()=>{state.dqSel=d.id;}});
  });
  riskFlags.filter(f=>f.status==='OPEN'||f.status==='REVIEWING').forEach(f=>{
    const lv=RISK_LEVEL[f.type]||'LOW';
    A.push({sev:lv==='CRITICAL'?3:lv==='HIGH'?2:1,tag:lv+' RISK',t:`Review flag: ${f.type.replace(/_/g,' ')}`,
      why:lv==='CRITICAL'?'Critical: freeze linked wallets until the mismatch is reconciled.':f.status==='REVIEWING'?'Analyst review in progress — verify findings and close the loop.':'Monitor pattern and clear within 48h.',page:'risk'});
  });
  Object.entries(health.checks).forEach(([n,c])=>{ if(!c.ok) A.push({sev:2,tag:'SYSTEM',t:`Fix ${n.replace(/_/g,' ')}`,why:c.d+' — processing delays compound every hour.',page:'monitoring'}); });
  recon.filter(r=>r.rec==='MISMATCH').forEach(r=>A.push({sev:2,tag:'RECON',t:`Reconcile ${r.txId}`,why:`Rail and ledger differ by ${fmt(r.diff)} — clear before the next settlement run.`,page:'reconciliation'}));
  const pendPo=payouts.filter(p=>p.status==='PENDING'||p.status==='PROCESSING');
  if(pendPo.length) A.push({sev:1,tag:'PAYOUTS',t:`Settle ${pendPo.length} pending payout(s)`,why:`${fmt(pendPo.reduce((s,p)=>s+p.net,0))} waiting on freelancer wallets — confirm rail transfers.`,page:'payouts'});
  const kycPend=kycItems.filter(k=>k.status==='UNDER_REVIEW');
  if(kycPend.length) A.push({sev:kycPend.some(k=>k.pep||k.dup)?2:1,tag:'KYC',t:`Clear ${kycPend.length} identity review(s)`,
    why:kycPend.some(k=>k.pep)?'Includes a PEP match — compliance priority over the rest of the queue.':`Oldest application waiting since ${dt(kycPend.reduce((m,k)=>k.updated<m?k.updated:m,kycPend[0].updated))}.`,page:'kyc'});
  const repOpen=reportItems.filter(r=>r.status==='OPEN');
  if(repOpen.length) A.push({sev:1,tag:'TRUST',t:`Moderate ${repOpen.length} profile report(s)`,why:'Fraud and impersonation reports age into real user harm if left open.',page:'reports-queue'});
  return A.sort((a,b)=>b.sev-a.sev);
}

function actionCenter(){
  const items=actionItems();

function openViewer(docs, startIdx=0){

function kycDecide(decision){
  const sel=kycItems.find(k=>k.id===state.kycSel); if(!sel) return;
  let reason = state.kycReason||'';
  if(reason==='custom'){ const el=document.getElementById('kyc-custom'); reason=el?el.value.trim():''; if(!reason){ toast('Please type a custom reason.','alert'); return; } }
  if(decision==='CLEARER') reason='Photo is unclear, blurry, or cropped. Please re-upload a clear image.';
  if(decision==='REJECTED'&&!reason){ toast('Please provide a rejection reason.','alert'); return; }
  if(decision==='REJECTED') sel.status='REJECTED';
  else if(decision==='VERIFIED'){ sel.status='VERIFIED'; toast(`${sel.name||sel.email} verified for ${sel.tier.replace('_',' ')}.`); }
  else { sel.status='UNDER_REVIEW'; toast('Clearer photo requested from user.'); }
  if(reason&&decision!=='VERIFIED') sel.history=[{d:decision==='CLEARER'?'REJECTED':decision,by:'ST-1a4e',at:new Date().toISOString(),reason},...sel.history];
  if(decision==='CLEARER'){ sel.history=[{d:'REJECTED',by:'ST-1a4e',at:new Date().toISOString(),reason},...sel.history]; sel.status='UNDER_REVIEW'; }
  state.kycReason=''; state.kycSel=null; render();
  if(decision!=='VERIFIED'&&decision!=='CLEARER') toast('Application rejected.');
}

function dqResolve(){

const PERMS = ['MANAGE_STAFF','MANAGE_CONTRACTS','SETTLE_PAYOUTS','VIEW_LEDGER','MANAGE_DISPUTES','VIEW_RISK_FLAGS','EXPORT_REPORTS'];
const MROLES = ['SUPER_ADMIN','OPERATIONS_ADMIN','FINANCE_ADMIN','SUPPORT','COMPLIANCE_ADMIN'];
const hasPerm=(r,p)=> r==='SUPER_ADMIN' || (r==='OPERATIONS_ADMIN'&&!['MANAGE_STAFF','VIEW_LEDGER'].includes(p)) ||
 (r==='FINANCE_ADMIN'&&['SETTLE_PAYOUTS','VIEW_LEDGER','EXPORT_REPORTS'].includes(p)) ||
 (r==='SUPPORT'&&p==='MANAGE_DISPUTES') || (r==='COMPLIANCE_ADMIN'&&['VIEW_RISK_FLAGS','VIEW_LEDGER'].includes(p));
pages.staff = () => { setKeys(null);
  const rows = staff.map(s=>`<tr>
    <td class="cell-main" style="font-weight:600">${s.email}</td>
    <td class="mono" style="font-size:12px;color:var(--text-2)">${s.ucid}</td>
    <td>${pill(s.role)}</td>
    <td>${editStaff===s.id
      ? `<select class="sel" id="roleSel-${s.id}" style="padding:5px 9px">${Object.keys(ROLE_LABELS).map(r=>`<option value="${r}" ${s.staffRole===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select>`
      : (s.staffRole?`<span class="pill ${PILL[s.staffRole]||'p-gray'}"><span class="pdot"></span>${ROLE_LABELS[s.staffRole]||s.staffRole}</span>`:'<span style="color:var(--text-3)">—</span>')}</td>
    <td>${s.suspended?pill('SUSPENDED'):'<span class="pill p-green"><span class="pdot"></span>Active</span>'}</td>
    <td>${editStaff===s.id
      ? `<span style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="saveStaff('${s.id}')">${ic('check',12)} Save</button><button class="btn btn-ghost btn-sm" onclick="editStaff=null;render()">Cancel</button></span>`
      : `<button class="btn btn-ghost btn-sm" onclick="editStaff='${s.id}';render()">Edit role</button>`}</td></tr>`).join('');
  const matrix = `<table class="tbl matrix" style="width:100%">
    <thead><tr><th>Permission</th>${MROLES.map(r=>`<th style="text-align:center" class="mono">${r.replace('_ADMIN','')}</th>`).join('')}</tr></thead>
    <tbody>${PERMS.map(p=>`<tr><td class="mono" style="font-size:11.5px;color:var(--text-2);font-weight:600">${p}</td>
      ${MROLES.map(r=>`<td style="text-align:center" class="${hasPerm(r,p)?'yes':'no'}">${hasPerm(r,p)?'●':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `<div class="fade">
    <div class="page-head"><div><div class="page-title">Administrators & Permissions</div><div class="page-sub">Staff accounts and their permission scopes. All role changes are audited.</div></div>
      <button class="btn btn-ghost" onclick="render()">${ic('refresh',14)} Refresh</button></div>
    ${tbl(['Email','UCID','User Role','Staff Role','Status',''],rows,pager(1,1,staff.length))}
    <div class="card card-pad" style="margin-top:24px">
      <div class="sec-title">${ic('shield',17)} Permission Matrix</div>
      <div class="tbl-wrap">${matrix}</div>
    </div></div>`;
};
function saveStaff(id){
  const sel=document.getElementById('roleSel-'+id);
  const s=staff.find(x=>x.id===id); if(s&&sel) s.staffRole=sel.value;
  editStaff=null; render();
}

/* — Reports (with analytics charts) — */
pages.reports = () => { setKeys(null);
  const f=reports.financial, mk=reports.marketplace;
  const kv=(k,v,warn)=>`<div class="kv"><div class="kv-k">${k}</div><div class="kv-v" ${warn&&+v>0?'style="color:var(--red)"':''}>${v}</div></div>`;
  const ST_C={ACTIVE:'#059669',COMPLETED:'#2563eb',TERMINATED:'#dc2626',CANCELLED:'#93a0b4'};
  const statusSegs=Object.entries(mk.byStatus).map(([s,n])=>({label:s.replace(/_/g,' '),value:n,color:ST_C[s]||'#93a0b4'}));
  return `<div class="fade">
    <div class="page-head"><div><div class="page-title">Reports</div><div class="page-sub">Financial and marketplace analytics · generated ${dts(health.checkedAt)}</div></div>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="render()">${ic('refresh',14)} Refresh</button>
      <button class="btn btn-primary">${ic('dl',14)} Download</button></div></div>
    <div class="sec-title">${ic('dollar',16)} Financial</div>
    <div class="grid g4" style="margin-bottom:24px">
      ${kv('Transaction Volume',fmt(f.vol))}${kv('Released Funds',fmt(f.released))}${kv('Refunded Funds',fmt(f.refunded))}${kv('Payouts',fmt(f.payouts))}
      ${kv('Platform Fees',fmt(f.fees))}${kv('WH Tax Accrued',fmt(f.wh))}${kv('Failed Payments',f.failPay,true)}${kv('Failed Payouts',f.failPo,true)}
    </div>
    <div class="sec-title">${ic('users',16)} Marketplace</div>
    <div class="grid g5" style="margin-bottom:24px">
      ${kv('Clients',mk.clients.toLocaleString())}${kv('Freelancers',mk.freelancers.toLocaleString())}${kv('Total Contracts',mk.totalContracts.toLocaleString())}${kv('Open Disputes',mk.disputes,true)}${kv('Open Risk Flags',mk.flags,true)}
    </div>
    <div class="grid gc-2-1" style="margin-bottom:16px">
      <div class="card card-pad">
        <div class="sec-title">${ic('chart',16)} Transaction Volume — last 12 weeks <span style="font-size:11px;color:var(--text-3);font-weight:700">ETB millions / week</span></div>
        ${areaChart(week12,vol12,'#059669')}
      </div>
      <div class="card card-pad">
        <div class="sec-title">${ic('brief',16)} Contracts by Status</div>
        ${donut(statusSegs,'contracts')}
      </div>
    </div>
    <div class="grid gc-1-1">
      <div class="card card-pad">
        <div class="sec-title">${ic('card',16)} Rail Volume — monthly</div>
        ${barChart(railMonths,[{name:'Telebirr',color:'#22c55e',values:railTele},{name:'CBE Birr',color:'#3b82f6',values:railCbe}])}
        ${chartLegend([{name:'Telebirr',color:'#22c55e'},{name:'CBE Birr',color:'#3b82f6'}])}
      </div>
      <div class="card card-pad">
        <div class="sec-title">${ic('brief',16)} Completed Contracts by Category</div>
        ${hbars(catDone.map(([l,v,c])=>({label:l,value:v,color:c,meta:'completed'})))}
      </div>
    </div>
  </div>`;
};
pages.risk = () => { setKeys(null);
  const open = riskFlags.filter(f=>f.status==='OPEN').length;
  const rows = riskFlags.map(f=>{
    const lv=RISK_LEVEL[f.type]||'LOW';
    return `<tr><td><div class="cell-main">${f.type.replace(/_/g,' ')}</div><div class="cell-sub mono">${f.id}</div></td>
    <td><span class="pill ${PILL[lv]}"><span class="pdot"></span>${lv}</span></td>
    <td>${pill(f.status)}</td>
    <td style="color:var(--text-2);font-size:12.5px">${dts(f.created)}</td>
    <td><button class="btn btn-ghost btn-sm">Review</button></td></tr>`}).join('');
  return `<div class="fade">
    <div class="page-head"><div><div class="page-title">Risk Flags</div><div class="page-sub">Transaction monitoring alerts from the TMS queue</div></div>
      <button class="btn btn-ghost" onclick="render()">${ic('refresh',14)} Refresh</button></div>
    ${open?banner('b-red','alert',`${open} flags require immediate attention.`,'WALLET_MISMATCH is CRITICAL — freeze related wallets until reviewed.'):''}
    ${tbl(['Flag Type','Risk Level','Status','Detected',''],rows,pager(1,1,riskFlags.length))}
  </div>`;
};
pages.monitoring = () => { setKeys(null);
  const h=health;
  return `<div class="fade">
    <div class="page-head"><div><div class="page-title">System Health</div><div class="page-sub">Infrastructure checks and ledger integrity monitor</div></div>
      <button class="btn btn-ghost" onclick="render()">${ic('refresh',14)} Check Again</button></div>
    <div class="grid g5" style="margin-bottom:16px">
      ${Object.entries(h.checks).map(([n,c])=>`<div class="card health-card ${c.ok?'h-ok':'h-bad'}">
        <div class="h-name">${n.replace(/_/g,' ')}</div>
        <div class="h-state">${c.ok?ic('checkC',16):ic('xC',16)} ${c.ok?'Healthy':'Degraded'}</div>
        <div class="h-detail">${c.d||''}</div></div>`).join('')}
    </div>
    ${h.ledger.bal
      ? banner('b-green','checkC','Ledger: Balanced',`— debits ${fmt(h.ledger.dr)} · credits ${fmt(h.ledger.cr)}`)
      : banner('b-red','xC','Ledger: MISMATCH',`— debits ${fmt(h.ledger.dr)} · credits ${fmt(h.ledger.cr)}`)}
    <div style="font-size:12px;color:var(--text-3);margin-top:4px;font-weight:600">Last checked ${dts(h.checkedAt)}</div>
  </div>`;
};

/* ═══════════ NAV & ROUTER ═══════════ */
const NAV = [
 {label:'Overview',items:[{id:'overview',name:'Command Center',icon:'dashboard'}]},
 {label:'Financial',items:[
   {id:'contracts',name:'Contracts',icon:'file'},
   {id:'payments',name:'Payments',icon:'card'},
   {id:'payouts',name:'Payouts',icon:'wallet',badge:()=>payouts.filter(p=>p.status==='PENDING'||p.status==='PROCESSING').length},
   {id:'escrow',name:'Escrow',icon:'dollar'},
   {id:'reconciliation',name:'Reconciliation',icon:'scale',badge:()=>recon.filter(r=>r.rec==='MISMATCH').length},
   {id:'ledger',name:'Ledger',icon:'book'}]},
 {label:'Review Queues',items:[
   {id:'kyc',name:'KYC Reviews',icon:'uCheck',badge:()=>kycItems.filter(k=>k.status==='UNDER_REVIEW').length},
   {id:'dispute-queue',name:'Dispute Mediation',icon:'scale',badge:()=>disputeItems.filter(d=>d.stage==='STAGE_3_MEDIATION').length},
   {id:'reports-queue',name:'Profile Reports',icon:'alert',badge:()=>reportItems.filter(r=>r.status==='OPEN').length}]},
 {label:'Operations',items:[
   {id:'users',name:'Users',icon:'users'},
   {id:'staff',name:'Staff & Roles',icon:'shield'},
   {id:'reports',name:'Reports',icon:'chart'},
   {id:'risk',name:'Risk Flags',icon:'xC',badge:()=>riskFlags.filter(f=>f.status==='OPEN').length},
   {id:'monitoring',name:'System Health',icon:'activity',badge:()=>Object.values(health.checks).filter(c=>!c.ok).length}]},
];
let current='overview';
const state={};

function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(g=>`
    <div class="nav-group"><div class="nav-label">${g.label}</div>
    ${g.items.map(i=>{const b=i.badge?i.badge():0;return `<button class="nav-item ${current===i.id?'active':''}" onclick="go('${i.id}')">
      ${ic(i.icon,16)} ${i.name} ${b?`<span class="nav-badge">${b}</span>`:''}</button>`}).join('')}
    </div>`).join('');
}
function go(id){ current=id; toggleSidebar(false); render(); }
function render(){
  if(viewer.open) return;
  buildNav();
  const item = NAV.flatMap(g=>g.items).find(i=>i.id===current);
  document.getElementById('crumb').innerHTML = `Ops / <b>${item?item.name:''}</b>`;
  document.getElementById('view').innerHTML = pages[current] ? pages[current]() : pages.overview();
  window.scrollTo(0,0);
}
function toggleSidebar(force){
  const sb=document.getElementById('sidebar'), ov=document.getElementById('overlay');
  const open = force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open); ov.classList.toggle('show',open);
}
render();
</script>
